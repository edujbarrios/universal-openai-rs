name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  rust:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Check formatting
        run: cargo fmt --check

      - name: Run clippy
        run: cargo clippy --all-targets -- -D warnings

      - name: Check minimal rustls build
        run: cargo check --no-default-features --features rustls

      - name: Check native-tls build
        run: cargo check --no-default-features --features native-tls

      - name: Check optional feature build
        run: cargo check --all-targets --features "audio files structured-output stream"

      - name: Check examples
        run: cargo check --examples

      - name: Run tests
        run: cargo test

      - name: Run optional feature tests
        run: cargo test --features "audio files structured-output stream"

      - name: Build docs
        run: cargo doc --no-deps
