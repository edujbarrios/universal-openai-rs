[package]
name = "universal-openai-rs"
version = "0.1.0"
edition = "2021"
authors = ["Eduardo J. Barrios <edujbarrios@users.noreply.github.com>"]
license = "MIT"
description = "A self-maintained, OpenAI-compatible API wrapper for Rust."
repository = "https://github.com/edujbarrios/universal-openai-rs"
readme = "README.md"
keywords = ["openai", "llm", "api", "rust", "client"]
categories = ["api-bindings", "web-programming::http-client"]

[dependencies]
async-stream = "0.3"
futures-core = "0.3"
futures-util = "0.3"
reqwest = { version = "0.12", default-features = false, features = ["json", "multipart", "rustls-tls", "stream"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "1"
tokio = { version = "1", features = ["time"] }

[dev-dependencies]
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
