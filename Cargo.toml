[package]
name = "universal-openai-rs"
version = "0.1.0"
edition = "2021"
rust-version = "1.78"
authors = ["Eduardo J. Barrios <edujbarrios@users.noreply.github.com>"]
license = "MIT"
description = "A self-maintained, OpenAI-compatible API wrapper for Rust."
repository = "https://github.com/edujbarrios/universal-openai-rs"
homepage = "https://github.com/edujbarrios/universal-openai-rs"
readme = "README.md"
keywords = ["openai", "llm", "api", "rust", "client"]
categories = ["api-bindings", "web-programming::http-client"]

[features]
default = ["rustls", "stream", "multipart"]
rustls = ["reqwest/rustls-tls"]
native-tls = ["reqwest/native-tls"]
stream = ["dep:async-stream", "dep:futures-core", "dep:futures-util", "reqwest/stream"]
multipart = ["reqwest/multipart"]
agents = []
audio = ["multipart"]
files = ["multipart"]
structured-output = ["dep:schemars"]

[dependencies]
async-stream = { version = "0.3", optional = true }
futures-core = { version = "0.3", optional = true }
futures-util = { version = "0.3", optional = true }
httpdate = "1"
reqwest = { version = "0.12", default-features = false, features = ["json"] }
schemars = { version = "0.8", optional = true }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "1"
tokio = { version = "1", features = ["time"] }

[dev-dependencies]
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }

[[example]]
name = "audio"
path = "examples/audio.rs"
required-features = ["audio"]

[[example]]
name = "files"
path = "examples/files.rs"
required-features = ["files"]

[[example]]
name = "streaming"
path = "examples/streaming.rs"
required-features = ["stream"]
